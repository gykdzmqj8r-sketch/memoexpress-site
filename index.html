<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemoExpress</title>
<meta name="description" content="Páginas públicas da extensão MemoExpress.">
<style>
  :root { --bg: #fbf6ee; --paper: #ffffff; --ink: #1f1b13; --muted: #5f5748; --line: #e6dac4; --accent: #7b5800; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --paper: #211d16; --ink: #efe6d8; --muted: #b9ae9b; --line: #3a3326; --accent: #f2c35b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 520px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 24px; margin: 6px 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="brand">MemoExpress</div>
  <h1>Anotações rápidas no navegador</h1>
  <p>Extensão para Google Chrome com anotações, tarefas e prints de tela.</p>
  <a href="privacidade.html">Política de Privacidade →</a>
</main>
</body>
</html>
